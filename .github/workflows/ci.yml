name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: install
        run: pip install -r requirements-dev.txt

      # The audio/OCR stack is optional: the suite skips the face tests when the
      # model file is absent and the e2e test unless TRANSCRIBE_E2E=1.
      - name: pytest
        run: python -m pytest tests -q

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install
        run: npm ci --no-audit --no-fund

      - name: typecheck and build
        run: npm run build

  commit-messages:
    name: commit message format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same rule as .githooks/commit-msg, so the convention cannot drift when
      # someone commits from an environment without the hook installed.
      - name: check subjects
        shell: bash
        run: |
          pattern='^(feat|fix|docs|test|refactor|perf|build|ci|chore|style)(\([a-z0-9-]+\))?: [a-z0-9].{0,66}$'
          failed=0
          while IFS= read -r subject; do
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              printf 'bad commit subject: %s\n' "$subject"
              failed=1
            fi
            if [ "${#subject}" -gt 72 ]; then
              printf 'subject longer than 72 chars: %s\n' "$subject"
              failed=1
            fi
          done < <(git log --format=%s)
          exit $failed

  lint:
    name: static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: install
        run: pip install -r requirements-dev.txt

      - name: ruff
        working-directory: .
        run: ruff check backend tools scripts